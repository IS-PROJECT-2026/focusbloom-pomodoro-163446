<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
        name="description"
        content="FocusBloom is a personal Pomodoro study timer for focused work and structured breaks."
    >

    <title>FocusBloom | Pomodoro Study Timer</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <main class="app-container">

        <header class="app-header">
            <h1>FocusBloom</h1>
            <p>Focus deeply. Rest intentionally. Keep blooming.</p>
        </header>

        <section class="timer-card">

            <div class="mode-selector">
                <button class="mode-button active" data-mode="focus" type="button">
                    Focus
                </button>

                <button class="mode-button" data-mode="short-break" type="button">
                    Short Break
                </button>

                <button class="mode-button" data-mode="long-break" type="button">
                    Long Break
                </button>
            </div>

            <div class="timer-display">
                <p class="mode-label">Focus Session</p>
                <p id="timer">25:00</p>
            </div>

            <div class="timer-controls">
                <button id="start-button" type="button">Start</button>
                <button id="pause-button" type="button">Pause</button>
                <button id="reset-button" type="button">Reset</button>
            </div>

        </section>

        <section class="progress-section">
            <h2>Today's Progress</h2>

            <p>
                Focus sessions completed:
                <strong id="session-count">0</strong>
            </p>

            <p>
                Daily goal:
                <strong>4 sessions</strong>
            </p>
        </section>

        <section class="motivation-section">
            <h2>Mindful Reminder</h2>

            <p id="motivation-message">
                Small focused steps create meaningful progress.
            </p>
        </section>

    </main>

    <script src="js/app.js"></script>
</body>
</html>
